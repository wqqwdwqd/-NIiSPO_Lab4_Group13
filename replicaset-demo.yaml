
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: lab4-replicaset
  labels:
    app: lab4-rs-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab4-rs-demo
  template:
    metadata:
      labels:
        app: lab4-rs-demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
